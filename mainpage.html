<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance App</title>
    <link rel="stylesheet" href="template/profile.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div>
        <p class="title">FINANCE TRACKER</p>
        <p class="date">Date</p>
      </div>

      <div class="profile-section" id="profile-trigger" onclick="toggleMenu()">
        <a href="add_transaction.html" class="new_data">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>

          Add Transaction
        </a>
        <!-- <img src="..." alt="Your profile picture" /> -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          strokeWidth="{1.5}"
          stroke="currentColor"
          className="size-6"
          class="profile"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>

        <div id="profile-menu" class="hidden">
          <p>Settings</p>
          <p>Logout</p>
        </div>
      </div>
    </header>

    <main class="cards">
      <a href="transaction-history.html" class="card income">
        <p class="card-label">INCOME</p>
        <p class="card-amount">GH₵ 0.00</p>
        <p class="card-period">THIS MONTH</p>
      </a>

      <div class="card net">
        <p class="card-label">NET TOTAL</p>
        <p class="card-amount">GH₵ 0.00</p>
        <p class="card-period">BALANCE</p>
      </div>

      <a href="transaction-history.html" class="card expenses">
        <p class="card-label">EXPENSES</p>
        <p class="card-amount">GH₵ 0.00</p>
        <p class="card-period">vs. LAST MONTH</p>
      </a>

      <div class="card income">
        <p class="card-label">LAST MONTH INCOME</p>
        <p class="card-amount">GH₵ 0.00</p>
        <p class="card-period">LAST MONTH</p>
      </div>

      <div class="card per">
        <p class="card-label">SAVINGS RATE</p>
        <div>
          <p class="card-amount">0.00%</p>
        </div>
        <p class="card-period">IN ALL</p>
      </div>

      <div class="card expenses">
        <p class="card-label">LAST MONTH EXPENSES</p>
        <p class="card-amount">GH₵ 0.00</p>
        <p class="card-period">LAST MONTH</p>
      </div>
    </main>
  </body>
</html>
