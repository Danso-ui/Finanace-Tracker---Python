<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Transaction</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="add.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div>
        <p class="title">FINANCE TRACKER</p>
        <p class="date">Date</p>
      </div>

      <div class="profile-section">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          strokeWidth="{1.5}"
          stroke="currentColor"
          className="size-6"
          class="profile"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>
      </div>
    </header>

    <main class="form">
      <header class="top">
        <p>Add Transaction</p>

        <button
          type="button"
          onclick="window.location.href='mainpage.html'"
          command="close"
          class="close p-1 m-1 btn-close bg-opacity-1"
          aria-label="Close"
        ></button>
      </header>

      <div class="toggle-container">
        <button class="toggle-btn income active" onclick="setToggle('income')">
          Income
        </button>
        <button class="toggle-btn expenses" onclick="setToggle('expenses')">
          Expenses
        </button>
      </div>

      <form action="#">
        <label for="amount">Amount:</label>
        <input type="number" name="amount" id="amount" class="input" placeholder="0.00" required />
        <br />

        <label for="category">Category:</label>
        <select name="category" id="category">
          <optgroup label="Income">
            <option value="salary">Salary</option>
            <option value="freelance">Freelance</option>
            <option value="investment">Investment</option>
            <option value="gift">Gift</option>
            <option value="other_income">Other</option>
          </optgroup>

          <optgroup label="Expenses">
            <option value="food">Food</option>
            <option value="rent">Rent</option>
            <option value="transport">Transport</option>
            <option value="utilities">Utilities</option>
            <option value="health">Health</option>
            <option value="entertainment">Entertianment</option>
            <option value="shopping">Shopping</option>
            <option value="other_expenses">Other</option>
          </optgroup>
        </select>

        <br />

        <label for="date">Date</label>
        <input type="datetime-local" name="date" id="date" class="input" required />

        <br />

        <label for="note">Note (Optional):</label>
        <textarea name="note" id="note" cols="53" rows="1"></textarea>

        <footer>
          <button type="reset"  class="btn btn-outline-secondary cancel">Cancel</button>
          <input type="submit" class="btn submit">
        </footer>
      </form>
    </main>
  </body>

  <script>
    function setToggle(type) {
      document
        .querySelectorAll(".toggle-btn")
        .forEach((btn) => btn.classList.remove("active"));

      document.querySelector("." + type).classList.add("active");
    }
  </script>
</html>
